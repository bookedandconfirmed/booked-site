<!-- Access Form with Legal Binding Checkbox -->
<section id="access" class="py-20 px-6 max-w-xl mx-auto" x-data="{ name: '', business: '', email: '', agreed: false, submitted: false, loading: false }">
    <div class="brutal-card p-8 sm:p-10 rounded-2xl text-center relative">
        <h2 class="text-3xl font-black mb-3">Get Started With Us</h2>
        <p class="text-sm text-neutral-400 mb-8">Fill out your details below to set up your account.</p>

        <div x-show="!submitted" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-mono text-neutral-400 uppercase mb-2">Your Name</label>
                <input type="text" x-model="name" placeholder="Jordan Vance" class="w-full bg-black border border-[#222222] rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-neutral-500 transition">
            </div>
            <div>
                <label class="block text-xs font-mono text-neutral-400 uppercase mb-2">Business / Practice Name</label>
                <input type="text" x-model="business" placeholder="Vance Consulting" class="w-full bg-black border border-[#222222] rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-neutral-500 transition">
            </div>
            <div>
                <label class="block text-xs font-mono text-neutral-400 uppercase mb-2">Email Address</label>
                <input type="email" x-model="email" placeholder="jordan@vanceconsulting.com" class="w-full bg-black border border-[#222222] rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-neutral-500 transition">
            </div>
            
            <!-- Legal Consent Checkbox for Form Compliance -->
            <div class="flex items-start space-x-3 pt-2">
                <input type="checkbox" x-model="agreed" id="legal-box" class="mt-1 accent-emerald-500 w-4 h-4 cursor-pointer rounded shrink-0">
                <label for="legal-box" class="text-[11px] text-neutral-400 leading-relaxed cursor-pointer">
                    I agree to the <button type="button" @click="activeModal = 'tos'" class="underline text-white">Terms of Service</button> and <button type="button" @click="activeModal = 'privacy'" class="underline text-white">Privacy Policy</button>, and consent to receive transactional notifications.
                </label>
            </div>

            <button @click="
                if(!name || !business || !email) { 
                    alert('Please fill out all fields including your email.'); 
                } else if(!agreed) { 
                    alert('Please check the legal agreement box to continue.'); 
                } else {
                    loading = true;
                    supabase.from('signups').insert([{ name: name, business: business, email: email }])
                        .then(({ error }) => {
                            loading = false;
                            if(error) {
                                alert('Error saving: ' + error.message);
                            } else {
                                submitted = true;
                            }
                        });
                }
            " :disabled="loading" class="w-full bg-white text-black font-bold py-3.5 rounded-xl hover:bg-neutral-200 transition text-sm mt-4 disabled:opacity-50">
                <span x-show="!loading">Continue</span>
                <span x-show="loading">Saving...</span>
            </button>
        </div>

        <div x-show="submitted" class="space-y-6 py-4" x-transition>
            <div class="p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-300 text-sm font-mono">
                ✓ Request received. We will email your onboarding setup link shortly to <span class="underline" x-text="email"></span>.
            </div>
        </div>
    </div>
</section>
